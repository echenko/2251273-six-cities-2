openapi: 3.0.3
info:
  title: Real Estate Rental API
  description: |
    REST API для сервиса аренды недвижимости.
    Спецификация построена на основе сущностей:
    - User;
    - Offer;
    - Comment.
    Основные ресурсы:
    - пользователи;
    - предложения;
    - комментарии;
    - аутентификация.
    В качестве публичных идентификаторов ресурсов используются строковые id,
    сгенерированные на сервере. Внутренний MongoDB _id наружу не отдаётся.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Users
    description: Операции с пользователями
  - name: Offers
    description: Операции с предложениями
  - name: Comments
    description: Операции с комментариями
  - name: Auth
    description: Аутентификация
paths:
  /users:
    post:
      tags:
        - Users
      summary: Создание пользователя
      description: |
        Создаёт нового пользователя.
        Используется как регистрация.
        Поля id, createdAt и updatedAt генерируются сервером автоматически.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Получение пользователя по ID
      description: Возвращает данные пользователя по публичному идентификатору.
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: Публичный идентификатор пользователя
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}/offers:
    get:
      tags:
        - Offers
      summary: Получение предложений пользователя
      description: Возвращает список предложений, созданных конкретным пользователем.
      operationId: getUserOffers
      parameters:
        - name: userId
          in: path
          required: true
          description: Публичный идентификатор пользователя
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых предложений
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: Список предложений пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /offers:
    get:
      tags:
        - Offers
      summary: Получение списка предложений
      description: |
        Возвращает список предложений.
        Поддерживает фильтрацию по городу и ограничение количества результатов.
      operationId: getOffers
      parameters:
        - name: city
          in: query
          required: false
          description: Название города
          schema:
            $ref: '#/components/schemas/CityName'
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых предложений
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
    post:
      tags:
        - Offers
      summary: Создание предложения
      description: |
        Создаёт новое предложение.
        Требует авторизации пользователя.
        Поля id, createdAt и updatedAt генерируются сервером автоматически.
        Поле user не передаётся клиентом и определяется из токена авторизации.
      operationId: createOffer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferInput'
      responses:
        '201':
          description: Предложение успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /offers/{offerId}:
    get:
      tags:
        - Offers
      summary: Получение предложения по ID
      description: Возвращает подробную информацию о предложении.
      operationId: getOfferById
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Предложение успешно найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Offers
      summary: Удаление предложения
      description: |
        Удаляет предложение по публичному идентификатору.
        Требует авторизации пользователя.
      operationId: deleteOffer
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Предложение успешно удалено
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /offers/{offerId}/comments:
    get:
      tags:
        - Comments
      summary: Получение комментариев предложения
      description: Возвращает список комментариев, оставленных к предложению.
      operationId: getOfferComments
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых комментариев
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Список комментариев предложения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Comments
      summary: Создание комментария
      description: |
        Создаёт новый комментарий к предложению.
        Требует авторизации пользователя.
        Поля id, createdAt и updatedAt генерируются сервером автоматически.
        Поле user не передаётся клиентом и определяется из токена авторизации.
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentInput'
      responses:
        '201':
          description: Комментарий успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /offers/{offerId}/comments/{commentId}:
    delete:
      tags:
        - Comments
      summary: Удаление комментария
      description: |
        Удаляет комментарий по публичному идентификатору.
        Требует авторизации пользователя.
        Удалить может только автор комментария.
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          description: Публичный идентификатор комментария
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Комментарий успешно удалён
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь не является автором комментария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Комментарий не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в систему
      description: |
        Аутентифицирует пользователя по email и паролю.
        В случае успеха возвращает токен и данные пользователя.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserType:
      type: string
      enum:
        - regular
        - pro
    OfferType:
      type: string
      enum:
        - apartment
        - house
        - room
        - hotel
    CityName:
      type: string
      enum:
        - Paris
        - Cologne
        - Brussels
        - Amsterdam
        - Hamburg
        - Dusseldorf
    User:
      type: object
      required:
        - id
        - name
        - email
        - avatarUrl
        - type
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Публичный идентификатор пользователя
          example: 3f7b9f2e-8d4c-4b1a-9c6e-2f8a7d6b5c4d
        name:
          type: string
          description: Имя пользователя
          minLength: 1
          maxLength: 50
          example: Ivan
        email:
          type: string
          format: email
          description: Email пользователя
          example: ivan@example.com
        avatarUrl:
          type: string
          description: Ссылка на аватар пользователя
          example: /avatars/ivan.png
        type:
          $ref: '#/components/schemas/UserType'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания пользователя
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время обновления пользователя
    CreateUser:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: Имя пользователя
          minLength: 1
          maxLength: 50
          example: Ivan
        email:
          type: string
          format: email
          description: Email пользователя
          example: ivan@example.com
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: password123
        avatarUrl:
          type: string
          description: Ссылка на аватар пользователя
          example: /avatars/ivan.png
        type:
          $ref: '#/components/schemas/UserType'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          example: ivan@example.com
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: password123
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT-токен доступа
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        user:
          $ref: '#/components/schemas/User'
    Offer:
      type: object
      required:
        - id
        - title
        - type
        - price
        - previewImage
        - cityName
        - cityLatitude
        - cityLongitude
        - cityZoom
        - offerLatitude
        - offerLongitude
        - offerZoom
        - isFavorite
        - isPremium
        - rating
        - description
        - bedrooms
        - offerGoods
        - user
        - images
        - maxAdults
        - commentsCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Публичный идентификатор предложения
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        title:
          type: string
          description: Название предложения
          minLength: 10
          maxLength: 100
          example: Beautiful apartment in Paris
        type:
          $ref: '#/components/schemas/OfferType'
        price:
          type: number
          description: Стоимость аренды
          minimum: 100
          maximum: 100000
          example: 1200
        previewImage:
          type: string
          description: Ссылка на превью изображение
          example: /images/offer-preview.jpg
        cityName:
          $ref: '#/components/schemas/CityName'
        cityLatitude:
          type: number
          format: double
          description: Широта города
          example: 48.8566
        cityLongitude:
          type: number
          format: double
          description: Долгота города
          example: 2.3522
        cityZoom:
          type: number
          description: Zoom карты города
          example: 12
        offerLatitude:
          type: number
          format: double
          description: Широта предложения
          example: 48.8566
        offerLongitude:
          type: number
          format: double
          description: Долгота предложения
          example: 2.3522
        offerZoom:
          type: number
          description: Zoom карты предложения
          example: 16
        isFavorite:
          type: boolean
          description: Флаг избранного
          example: false
        isPremium:
          type: boolean
          description: Флаг премиум-предложения
          example: true
        rating:
          type: number
          format: float
          description: Рейтинг предложения
          minimum: 1
          maximum: 5
          example: 4.5
        description:
          type: string
          description: Описание предложения
          minLength: 20
          maxLength: 1024
          example: A cozy apartment located in the center of Paris.
        bedrooms:
          type: integer
          description: Количество спален
          minimum: 1
          maximum: 8
          example: 2
        offerGoods:
          type: array
          description: Список удобств
          items:
            type: string
          example:
            - Wi-Fi
            - Kitchen
            - Washing machine
        user:
          $ref: '#/components/schemas/User'
        images:
          type: array
          description: Список изображений предложения
          items:
            type: string
          example:
            - /images/offer-1.jpg
            - /images/offer-2.jpg
            - /images/offer-3.jpg
        maxAdults:
          type: integer
          description: Максимальное количество гостей
          minimum: 1
          maximum: 10
          example: 4
        commentsCount:
          type: integer
          description: Количество комментариев к предложению
          minimum: 0
          example: 5
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания предложения
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время обновления предложения
    CreateOfferInput:
      type: object
      description: |
        Данные для создания предложения от клиента.
        Поле user не передаётся клиентом и определяется на сервере
        из авторизованного пользователя.
        Поля id, createdAt, updatedAt и commentsCount генерируются сервером автоматически.
      required:
        - title
        - type
        - price
        - previewImage
        - cityName
        - cityLatitude
        - cityLongitude
        - cityZoom
        - offerLatitude
        - offerLongitude
        - offerZoom
        - rating
        - description
        - bedrooms
        - offerGoods
        - images
        - maxAdults
      properties:
        title:
          type: string
          description: Название предложения
          minLength: 10
          maxLength: 100
          example: Beautiful apartment in Paris
        type:
          $ref: '#/components/schemas/OfferType'
        price:
          type: number
          description: Стоимость аренды
          minimum: 100
          maximum: 100000
          example: 1200
        previewImage:
          type: string
          description: Ссылка на превью изображение
          example: /images/offer-preview.jpg
        cityName:
          $ref: '#/components/schemas/CityName'
        cityLatitude:
          type: number
          format: double
          description: Широта города
          example: 48.8566
        cityLongitude:
          type: number
          format: double
          description: Долгота города
          example: 2.3522
        cityZoom:
          type: number
          description: Zoom карты города
          example: 12
        offerLatitude:
          type: number
          format: double
          description: Широта предложения
          example: 48.8566
        offerLongitude:
          type: number
          format: double
          description: Долгота предложения
          example: 2.3522
        offerZoom:
          type: number
          description: Zoom карты предложения
          example: 16
        isFavorite:
          type: boolean
          description: Флаг избранного
          default: false
          example: false
        isPremium:
          type: boolean
          description: Флаг премиум-предложения
          default: false
          example: false
        rating:
          type: number
          format: float
          description: Рейтинг предложения
          minimum: 1
          maximum: 5
          example: 4.5
        description:
          type: string
          description: Описание предложения
          minLength: 20
          maxLength: 1024
          example: A cozy apartment located in the center of Paris.
        bedrooms:
          type: integer
          description: Количество спален
          minimum: 1
          maximum: 8
          example: 2
        offerGoods:
          type: array
          description: Список удобств
          items:
            type: string
          example:
            - Wi-Fi
            - Kitchen
            - Washing machine
        images:
          type: array
          description: Список изображений предложения
          items:
            type: string
          example:
            - /images/offer-1.jpg
            - /images/offer-2.jpg
            - /images/offer-3.jpg
        maxAdults:
          type: integer
          description: Максимальное количество гостей
          minimum: 1
          maximum: 10
          example: 4
    Comment:
      type: object
      description: Комментарий к предложению.
      required:
        - id
        - text
        - rating
        - user
        - offer
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Публичный идентификатор комментария
          example: 9a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        text:
          type: string
          description: Текст комментария
          minLength: 5
          maxLength: 1024
          example: Great place, highly recommend!
        rating:
          type: number
          format: float
          description: Оценка предложения от автора комментария
          minimum: 1
          maximum: 5
          example: 4.0
        user:
          $ref: '#/components/schemas/User'
        offer:
          $ref: '#/components/schemas/Offer'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания комментария
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время обновления комментария
    CreateCommentInput:
      type: object
      description: |
        Данные для создания комментария от клиента.
        Поле user не передаётся клиентом и определяется на сервере
        из авторизованного пользователя.
        Поля id, createdAt и updatedAt генерируются сервером автоматически.
      required:
        - text
        - rating
      properties:
        text:
          type: string
          description: Текст комментария
          minLength: 5
          maxLength: 1024
          example: Great place, highly recommend!
        rating:
          type: number
          format: float
          description: Оценка предложения
          minimum: 1
          maximum: 5
          example: 4.0
    Error:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: HTTP-статус ошибки
          example: 404
        error:
          type: string
          description: Текстовое название ошибки
          example: Not Found
        message:
          type: string
          description: Сообщение об ошибке
          example: Entity not found
