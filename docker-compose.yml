version: '3.8'

services:
  # MongoDB
  db:
    image: mongo:6.0
    restart: always
    container_name: buy-and-sell_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:27017
    volumes:
      - buy-and-sell_data:/data/db
    networks:
      - buy-and-sell-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Mongo Express (веб-интерфейс)
  db_ui:
    image: mongo-express:1.0.2-20
    restart: always
    container_name: buy-and-sell_mongo_express
    ports:
      - 8081:8081
    environment:
      # Защита веб-интерфейса паролем (Basic Auth)
      ME_CONFIG_BASICAUTH_USERNAME: ${UI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${UI_PASSWORD:-admin}
      # Учетные данные для подключения к MongoDB
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      # Строка подключения (использует имя сервиса 'db' как хост)
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASSWORD}@db:27017/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buy-and-sell-network

# Тома для хранения данных
volumes:
  buy-and-sell_data:

# Сеть для изоляции сервисов
networks:
  buy-and-sell-network:
    driver: bridge
